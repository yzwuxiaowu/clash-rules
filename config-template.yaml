# ============================================================
# OpenClash 代理分组配置（基于官方 default.yaml 格式生成）
# 来源参考：vernesong/OpenClash  luci-app-openclash/res/default.yaml
# 使用说明：
#   1. 将下方 proxies 中的占位节点替换为你自己的节点
#   2. 或将本文件的 proxy-groups 和 rules 部分合并到你的现有配置中
#   3. AI 网站流量将走 "AI" 策略组，可在面板中手动切换出口
# ============================================================

# ----------------------------------------------------------
# 代理节点（示例占位，请替换为你的实际节点）
# ----------------------------------------------------------
proxies:
  - name: "YOUR_NODE_1"
    type: ss
    server: server1.example.com
    port: 443
    cipher: chacha20-ietf-poly1305
    password: "your_password"
    udp: true

  - name: "YOUR_NODE_2"
    type: vmess
    server: server2.example.com
    port: 443
    uuid: your-uuid-here
    alterId: 0
    cipher: auto
    network: ws
    tls: true
    ws-opts:
      path: "/"
      headers:
        Host: server2.example.com

  - name: "YOUR_NODE_3"
    type: trojan
    server: server3.example.com
    port: 443
    password: "your_password"
    udp: true
    sni: server3.example.com

# ----------------------------------------------------------
# 代理分组（proxy-groups）
# ----------------------------------------------------------
proxy-groups:

  # ===== 核心出口组 =====

  # 手动选择：总出口，所有其他组默认引用此组
  - name: "Proxy"
    type: select
    proxies:
      - YOUR_NODE_1
      - YOUR_NODE_2
      - YOUR_NODE_3
      - auto
      - fallback-auto
      - load-balance
    # default-selected: auto  # 默认选中的节点/组（可选）

  # 自动选择：按 URL 测试结果使用延迟最低节点
  - name: "auto"
    type: url-test
    proxies:
      - YOUR_NODE_1
      - YOUR_NODE_2
      - YOUR_NODE_3
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 150
    # lazy: true

  # 故障转移：按节点顺序依次尝试，不可用则切换下一个
  - name: "fallback-auto"
    type: fallback
    proxies:
      - YOUR_NODE_1
      - YOUR_NODE_2
      - YOUR_NODE_3
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300

  # 负载均衡：按算法随机/轮询选择节点
  - name: "load-balance"
    type: load-balance
    proxies:
      - YOUR_NODE_1
      - YOUR_NODE_2
      - YOUR_NODE_3
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    strategy: consistent-hashing  # 可选：round-robin / sticky-sessions / consistent-hashing

  # ===== 专用分组 =====

  # --- 国外 AI 网站专用组 ---
  # 所有匹配到 AI 规则的流量将走此组，可独立选择出口节点
  - name: "AI"
    type: select
    proxies:
      - Proxy          # 引用总出口组
      - YOUR_NODE_1
      - YOUR_NODE_2
      - YOUR_NODE_3
      - auto
    # default-selected: Proxy
    # 说明：如需 AI 走特定地区节点，将对应节点移到此处并设为 default-selected

  # --- 流媒体专用组（可选） ---
  - name: "Streaming"
    type: select
    proxies:
      - Proxy
      - YOUR_NODE_1
      - YOUR_NODE_2
      - YOUR_NODE_3

  # --- 电报 / 即时通讯专用组（可选） ---
  - name: "Telegram"
    type: select
    proxies:
      - Proxy
      - YOUR_NODE_1
      - YOUR_NODE_2
      - YOUR_NODE_3

  # --- 广告拦截（REJECT 组，用于规则引用） ---
  - name: "REJECT"
    type: select
    proxies:
      - REJECT
      - DIRECT

# ----------------------------------------------------------
